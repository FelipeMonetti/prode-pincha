<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prode Pincha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pantalla de login -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <div class="login-logo">⚽</div>
      <h1>Prode Pincha</h1>
      <p>Predicciones de Estudiantes de La Plata</p>
      <button id="btn-login" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 2.58 9 2.58Z" fill="#EA4335"/></svg>
        Iniciar con Google
      </button>
    </div>
  </div>

  <!-- Pantalla de selección de jugador (fallback si no se auto-linkea) -->
  <div id="pick-screen" class="screen hidden">
    <div class="login-container">
      <div class="login-logo">⚽</div>
      <h1>¿Quién sos?</h1>
      <p>Elegí tu jugador</p>
      <div id="pick-buttons" class="pick-buttons"></div>
    </div>
  </div>

  <!-- App principal -->
  <div id="app-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <span class="header-logo">⚽</span>
        <h1>Prode Pincha</h1>
      </div>
      <div class="header-right">
        <span id="player-name"></span>
        <button id="btn-logout" class="btn btn-small">Salir</button>
      </div>
    </header>

    <nav>
      <button class="nav-btn active" data-section="matches">
        <span class="nav-icon">📋</span>
        Partidos
      </button>
      <button class="nav-btn" data-section="standings">
        <span class="nav-icon">🏆</span>
        Tabla
      </button>
    </nav>

    <main>
      <section id="section-matches" class="section">
        <div id="matches-list">
          <div class="loading">
            <div class="spinner"></div>
            <p>Cargando partidos...</p>
          </div>
        </div>
      </section>

      <section id="section-standings" class="section hidden">
        <div id="standings-table">
          <div class="loading">
            <div class="spinner"></div>
            <p>Cargando tabla...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
