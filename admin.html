<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prode Pincha — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1923;
      --card: #1e2d3d;
      --accent: #e63946;
      --green: #00c853;
      --text: #f0f2f5;
      --muted: #8899a6;
      --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.9rem; }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-sync { background: var(--accent); margin-bottom: 24px; }
    .btn-sync:hover { box-shadow: 0 4px 16px rgba(230,57,70,0.3); }
    #log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 500px;
      min-height: 200px;
      font-size: 0.8rem;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 60vh;
    }
    .log-ok { color: var(--green); }
    .log-err { color: var(--accent); }
    .log-info { color: var(--muted); }
  </style>
</head>
<body>
  <h1>⚽ Admin — Sync Partidos</h1>
  <p class="subtitle">Sincroniza fixtures de Estudiantes desde TheSportsDB (gratis)</p>
  <button id="btn-sync" class="btn btn-sync">Sincronizar partidos</button>
  <div id="log"><span class="log-info">Listo para sincronizar...</span></div>


  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // TheSportsDB — API gratuita, key pública 123
    const TSDB_BASE = 'https://www.thesportsdb.com/api/v1/json/123';
    const TEAM_ID = 135160; // Estudiantes de La Plata

    const supabase = createClient(
      'https://khyurgitvicuaxbgcejb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoeXVyZ2l0dmljdWF4YmdjZWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTA3MTksImV4cCI6MjEwODc4NjcxOX0.7aKULS5_HZPwoX-t79tqwJiSLF2be2mTF_ejpQwo_SE'
    );

    const logEl = document.getElementById('log');
    const btn = document.getElementById('btn-sync');

    function log(msg, type = 'info') {
      const span = document.createElement('span');
      span.className = `log-${type}`;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      logEl.innerHTML = '';
    }

    // Calcular puntos: 3 = exacto, 1 = acertó ganador/empate, 0 = erró
    function calcPoints(predHome, predAway, realHome, realAway) {
      if (predHome === realHome && predAway === realAway) return 3;
      if (Math.sign(predHome - predAway) === Math.sign(realHome - realAway)) return 1;
      return 0;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Sincronizando...';
      clearLog();

      try {
        let allEvents = [];

        // 1. Traer próximos partidos
        log('Consultando próximos partidos...');
        const resNext = await fetch(`${TSDB_BASE}/eventsnext.php?id=${TEAM_ID}`);
        const dataNext = await resNext.json();
        const nextEvents = dataNext.events || [];
        log(`Próximos: ${nextEvents.length} partidos`, nextEvents.length > 0 ? 'ok' : 'info');
        allEvents = allEvents.concat(nextEvents);

        // 2. Traer últimos resultados
        log('Consultando últimos resultados...');
        const resLast = await fetch(`${TSDB_BASE}/eventslast.php?id=${TEAM_ID}`);
        const dataLast = await resLast.json();
        const lastEvents = dataLast.results || [];
        log(`Últimos: ${lastEvents.length} resultados`, lastEvents.length > 0 ? 'ok' : 'info');
        allEvents = allEvents.concat(lastEvents);

        // Eliminar duplicados por idEvent
        const seen = new Set();
        allEvents = allEvents.filter(e => {
          if (seen.has(e.idEvent)) return false;
          seen.add(e.idEvent);
          return true;
        });

        log(`Total: ${allEvents.length} partidos únicos`, 'ok');

        // 3. Sync cada partido a Supabase
        let synced = 0;
        let pointsCalculated = 0;

        for (const e of allEvents) {
          const status = e.strStatus === 'FT' ? 'FT'
                       : (e.strStatus === 'NS' || e.strStatus === 'Not Started') ? 'NS'
                       : e.strStatus === 'LIVE' ? 'LIVE'
                       : e.intHomeScore !== null ? 'FT' : 'NS';

          const matchData = {
            api_fixture_id: parseInt(e.idEvent),
            home_team: e.strHomeTeam,
            away_team: e.strAwayTeam,
            home_logo: e.strHomeTeamBadge || null,
            away_logo: e.strAwayTeamBadge || null,
            kickoff: e.strTimestamp,
            round: `${e.strLeague} — Fecha ${e.intRound}`,
            status,
          };

          // Si terminó, agregar scores
          if (status === 'FT' && e.intHomeScore !== null) {
            matchData.home_score = parseInt(e.intHomeScore);
            matchData.away_score = parseInt(e.intAwayScore);
          }

          const { data: match, error } = await supabase
            .from('matches')
            .upsert(matchData, { onConflict: 'api_fixture_id' })
            .select('id')
            .single();

          if (error) {
            log(`✗ ${e.strHomeTeam} vs ${e.strAwayTeam} — ${error.message}`, 'err');
            continue;
          }

          synced++;

          // 4. Si terminó, calcular puntos de predicciones sin puntaje
          if (status === 'FT' && e.intHomeScore !== null) {
            const realHome = parseInt(e.intHomeScore);
            const realAway = parseInt(e.intAwayScore);

            const { data: preds } = await supabase
              .from('predictions')
              .select('id, home_score, away_score')
              .eq('match_id', match.id)
              .is('points', null);

            if (preds && preds.length > 0) {
              for (const pred of preds) {
                const points = calcPoints(pred.home_score, pred.away_score, realHome, realAway);
                await supabase.from('predictions').update({ points }).eq('id', pred.id);
                pointsCalculated++;
              }
            }
          }
        }

        log(`\n--- RESUMEN ---`, 'info');
        log(`Partidos sincronizados: ${synced}/${allEvents.length}`, 'ok');
        log(`Predicciones puntuadas: ${pointsCalculated}`, 'ok');

      } catch (err) {
        log(`Error: ${err.message}`, 'err');
      }

      btn.disabled = false;
      btn.textContent = 'Sincronizar partidos';
      loadPendingMatches();
    });

  </script>
</body>
</html>
